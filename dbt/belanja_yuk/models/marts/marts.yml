version: 2

models:
  - name: dim_customers
    description: "Tabel dimensi pelanggan yang diperkaya dengan metrik transaksi dan flag integritas CRM"
    columns:
      - name: customer_id
        description: "Primary Key pelanggan"
        tests:
          - unique
          - not_null

  - name: dim_products
    description: "Tabel dimensi katalog produk dengan riwayat penjualan dan status stok"
    columns:
      - name: product_id
        description: "Primary Key produk"
        tests:
          - unique
          - not_null
      - name: price_idr
        description: "Harga jual produk dalam rupiah"
        tests:
          - not_null

  - name: fact_order_items
    description: "Tabel fakta transaksional per item pesanan (granular fact)"
    columns:
      - name: order_item_id
        description: "Primary Key surrogate per order item"
        tests:
          - unique
          - not_null
      - name: order_id
        description: "Foreign Key ke transaksi order"
        tests:
          - not_null
      - name: customer_id
        description: "Foreign Key relasional ke dim_customers"
        tests:
          - not_null
          - relationships:
              to: ref('dim_customers')
              field: customer_id
      - name: product_id
        description: "Foreign Key relasional ke dim_products"
        tests:
          - not_null
          - relationships:
              to: ref('dim_products')
              field: product_id
      - name: qty
        description: "Jumlah barang yang dibeli"
        tests:
          - not_null

  - name: fct_daily_sales
    description: "Tabel mart agregasi penjualan harian per kategori, metode pembayaran, dan channel"
    columns:
      - name: daily_sales_id
        description: "Primary Key komposit harian"
        tests:
          - unique
          - not_null
      - name: order_date
        description: "Tanggal transaksi"
        tests:
          - not_null
